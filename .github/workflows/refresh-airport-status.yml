name: Refresh FAA airport status

on:
  schedule:
    # Every 30 minutes, offset from the top of the hour to reduce queue delays.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airport-status-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch FAA feeds and update snapshot
        run: python scripts/update_airport_status.py

      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/airport-status.json
          if git diff --cached --quiet; then
            echo "Snapshot did not change."
          else
            git commit -m "Update FAA airport status snapshot"
            git push
          fi
